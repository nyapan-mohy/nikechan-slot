<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nikechan Slot Slump Preview</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f3ef;
      --panel: #fffdf9;
      --line: #d8d2c7;
      --text: #24211d;
      --muted: #6f675d;
      --accent: #d7335f;
      --blue: #2f72d6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      max-width: 1220px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 18px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
    }

    .note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      max-width: 520px;
      text-align: right;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      align-items: end;
      margin-bottom: 14px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    select,
    input,
    button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: inherit;
      padding: 8px 10px;
    }

    button {
      cursor: pointer;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 800;
    }

    .check {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
    }

    .check input {
      min-height: auto;
      width: 16px;
      height: 16px;
      padding: 0;
    }

    .chart-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 620px;
      background: #fff;
      border: 1px solid #e7e1d6;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      font-size: 13px;
    }

    th,
    td {
      padding: 9px 10px;
      border-bottom: 1px solid #ebe5da;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child { text-align: left; }

    th {
      background: #ece5da;
      color: #3a352f;
      font-size: 12px;
    }

    tr:last-child td { border-bottom: 0; }

    @media (max-width: 860px) {
      main { padding: 14px; }
      header { display: block; }
      .note { text-align: left; margin-top: 8px; }
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      canvas { height: 480px; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>スランプグラフ簡易プレビュー</h1>
      </div>
      <div class="note">
        現在の抽選テーブルで差枚の形を見るための簡易モデル。ボーナスは成立ゲームで純増を即加算し、正式なデータ表示端末機能には使わない。
      </div>
    </header>

    <section class="controls" aria-label="シミュレーション条件">
      <label>
        表示設定
        <select id="setting">
          <option value="setting1">設定1</option>
          <option value="setting2">設定2</option>
          <option value="setting3">設定3</option>
          <option value="setting4">設定4</option>
          <option value="setting5">設定5</option>
          <option value="setting6">設定6</option>
        </select>
      </label>
      <label>
        ゲーム数
        <input id="games" type="number" min="1000" max="100000" step="1000" value="8000">
      </label>
      <label>
        Seed
        <input id="seed" value="0x12345678" spellcheck="false">
      </label>
      <label>
        表示
        <span class="check"><input id="allSettings" type="checkbox" checked> 全設定を重ねる</span>
      </label>
      <label>
        実行
        <button id="run">再描画</button>
      </label>
    </section>

    <section class="chart-wrap">
      <canvas id="chart" width="1400" height="720"></canvas>
    </section>

    <table>
      <thead>
        <tr>
          <th>設定</th>
          <th>最終差枚</th>
          <th>最低</th>
          <th>最高</th>
          <th>BIG</th>
          <th>REG</th>
          <th>合算</th>
          <th>実測機械割</th>
        </tr>
      </thead>
      <tbody id="summary"></tbody>
    </table>
  </main>

  <script>
    const DENOMINATOR = 65536;
    const TABLES = {
      setting1: { BIG: 211, REG: 112, BELL: 12025, RARE_CHERRY: 1841, SUIKA: 64, REPLAY: 16640, BIG_RARE_CHERRY: 46, REG_RARE_CHERRY: 45 },
      setting2: { BIG: 213, REG: 118, BELL: 12092, RARE_CHERRY: 1841, SUIKA: 64, REPLAY: 16529, BIG_RARE_CHERRY: 48, REG_RARE_CHERRY: 49 },
      setting3: { BIG: 218, REG: 133, BELL: 12181, RARE_CHERRY: 1841, SUIKA: 64, REPLAY: 16380, BIG_RARE_CHERRY: 48, REG_RARE_CHERRY: 51 },
      setting4: { BIG: 225, REG: 149, BELL: 12273, RARE_CHERRY: 1841, SUIKA: 64, REPLAY: 16227, BIG_RARE_CHERRY: 48, REG_RARE_CHERRY: 57 },
      setting5: { BIG: 229, REG: 172, BELL: 12412, RARE_CHERRY: 1841, SUIKA: 64, REPLAY: 15995, BIG_RARE_CHERRY: 51, REG_RARE_CHERRY: 57 },
      setting6: { BIG: 248, REG: 191, BELL: 12603, RARE_CHERRY: 1841, SUIKA: 64, REPLAY: 15677, BIG_RARE_CHERRY: 52, REG_RARE_CHERRY: 64 }
    };
    const COLORS = {
      setting1: "#d33f5f",
      setting2: "#e0802f",
      setting3: "#c0a12f",
      setting4: "#3f9d62",
      setting5: "#2d8fbf",
      setting6: "#4358d8"
    };
    const LABELS = {
      setting1: "設定1",
      setting2: "設定2",
      setting3: "設定3",
      setting4: "設定4",
      setting5: "設定5",
      setting6: "設定6"
    };

    const els = {
      setting: document.getElementById("setting"),
      games: document.getElementById("games"),
      seed: document.getElementById("seed"),
      allSettings: document.getElementById("allSettings"),
      run: document.getElementById("run"),
      chart: document.getElementById("chart"),
      summary: document.getElementById("summary")
    };

    function parseSeed(value) {
      const raw = String(value || "").trim();
      if (raw.startsWith("0x") || raw.startsWith("0X")) return Number.parseInt(raw.slice(2), 16) >>> 0;
      const parsed = Number.parseInt(raw, 10);
      return Number.isFinite(parsed) ? parsed >>> 0 : 0x12345678;
    }

    function xorshift(seed) {
      let x = seed >>> 0;
      x ^= x << 13;
      x ^= x >>> 17;
      x ^= x << 5;
      return x >>> 0;
    }

    function simulate(settingId, games, seed) {
      const table = TABLES[settingId];
      const order = [
        ["BIG", table.BIG],
        ["REG", table.REG],
        ["BELL", table.BELL],
        ["RARE_CHERRY", table.RARE_CHERRY],
        ["SUIKA", table.SUIKA],
        ["REPLAY", table.REPLAY],
        ["BIG_RARE_CHERRY", table.BIG_RARE_CHERRY],
        ["REG_RARE_CHERRY", table.REG_RARE_CHERRY]
      ];
      let currentSeed = seed >>> 0;
      let diff = 0;
      let totalBet = 0;
      let totalPayout = 0;
      let min = 0;
      let max = 0;
      const counts = { BIG: 0, REG: 0 };
      const points = [{ game: 0, diff: 0 }];
      const stride = Math.max(1, Math.floor(games / 1200));

      for (let game = 1; game <= games; game += 1) {
        diff -= 3;
        totalBet += 3;
        currentSeed = xorshift(currentSeed);
        let pick = Math.floor((currentSeed / 0x100000000) * DENOMINATOR);
        let role = "NONE";

        for (const [name, weight] of order) {
          if (pick < weight) {
            role = name;
            break;
          }
          pick -= weight;
        }

        if (role === "BELL") {
          diff += 5;
          totalPayout += 5;
        } else if (role === "RARE_CHERRY") {
          diff += 2;
          totalPayout += 2;
        } else if (role === "SUIKA") {
          diff += 15;
          totalPayout += 15;
        } else if (role === "REPLAY") {
          diff += 3;
          totalPayout += 3;
        } else if (role === "BIG" || role === "BIG_RARE_CHERRY") {
          diff += 252;
          totalBet += 42;
          totalPayout += 294;
          counts.BIG += 1;
        } else if (role === "REG" || role === "REG_RARE_CHERRY") {
          diff += 96;
          totalBet += 16;
          totalPayout += 112;
          counts.REG += 1;
        }

        min = Math.min(min, diff);
        max = Math.max(max, diff);
        if (game % stride === 0 || role === "BIG" || role === "REG" || role === "BIG_RARE_CHERRY" || role === "REG_RARE_CHERRY") {
          points.push({ game, diff });
        }
      }

      return {
        settingId,
        points,
        final: diff,
        min,
        max,
        big: counts.BIG,
        reg: counts.REG,
        rate: totalPayout / totalBet * 100
      };
    }

    function draw(results, games) {
      const ctx = els.chart.getContext("2d");
      const width = els.chart.width;
      const height = els.chart.height;
      const margin = { l: 74, r: 28, t: 44, b: 56 };
      const innerW = width - margin.l - margin.r;
      const innerH = height - margin.t - margin.b;
      const minY = Math.min(-500, ...results.flatMap(result => result.points.map(point => point.diff)));
      const maxY = Math.max(500, ...results.flatMap(result => result.points.map(point => point.diff)));
      const x = game => margin.l + game / games * innerW;
      const y = diff => margin.t + (maxY - diff) / (maxY - minY) * innerH;

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);
      ctx.font = "18px system-ui, sans-serif";
      ctx.textBaseline = "middle";

      ctx.strokeStyle = "#e6e1d8";
      ctx.lineWidth = 1;
      for (let game = 0; game <= games; game += Math.max(1000, Math.ceil(games / 8 / 1000) * 1000)) {
        ctx.beginPath();
        ctx.moveTo(x(game), margin.t);
        ctx.lineTo(x(game), height - margin.b);
        ctx.stroke();
        ctx.fillStyle = "#6b6359";
        ctx.textAlign = "center";
        ctx.fillText(String(game), x(game), height - 24);
      }

      const yStep = Math.max(250, Math.ceil((maxY - minY) / 7 / 250) * 250);
      const startY = Math.floor(minY / yStep) * yStep;
      for (let diff = startY; diff <= maxY; diff += yStep) {
        ctx.strokeStyle = diff === 0 ? "#777" : "#e6e1d8";
        ctx.lineWidth = diff === 0 ? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(margin.l, y(diff));
        ctx.lineTo(width - margin.r, y(diff));
        ctx.stroke();
        ctx.fillStyle = "#6b6359";
        ctx.textAlign = "right";
        ctx.fillText(String(diff), margin.l - 12, y(diff));
      }

      results.forEach(result => {
        ctx.strokeStyle = COLORS[result.settingId];
        ctx.lineWidth = results.length === 1 ? 3.5 : 2.4;
        ctx.beginPath();
        result.points.forEach((point, index) => {
          if (index === 0) ctx.moveTo(x(point.game), y(point.diff));
          else ctx.lineTo(x(point.game), y(point.diff));
        });
        ctx.stroke();
      });

      ctx.textAlign = "left";
      ctx.font = "22px system-ui, sans-serif";
      ctx.fillStyle = "#222";
      ctx.fillText(`${games.toLocaleString()}G 簡易スランプ`, margin.l, 24);

      let legendY = margin.t + 22;
      results.forEach(result => {
        ctx.fillStyle = COLORS[result.settingId];
        ctx.fillRect(width - 205, legendY - 6, 26, 6);
        ctx.fillStyle = "#333";
        ctx.font = "17px system-ui, sans-serif";
        ctx.fillText(`${LABELS[result.settingId]} ${result.final}枚`, width - 168, legendY - 3);
        legendY += 28;
      });
    }

    function renderSummary(results, games) {
      els.summary.innerHTML = results.map(result => {
        const bonus = result.big + result.reg;
        const bonusText = bonus ? `1/${(games / bonus).toFixed(1)}` : "--";
        return `
          <tr>
            <td>${LABELS[result.settingId]}</td>
            <td>${result.final.toLocaleString()}枚</td>
            <td>${result.min.toLocaleString()}枚</td>
            <td>${result.max.toLocaleString()}枚</td>
            <td>${result.big}</td>
            <td>${result.reg}</td>
            <td>${bonusText}</td>
            <td>${result.rate.toFixed(2)}%</td>
          </tr>
        `;
      }).join("");
    }

    function run() {
      const games = Math.max(1000, Math.min(100000, Number.parseInt(els.games.value, 10) || 8000));
      const baseSeed = parseSeed(els.seed.value);
      const settingIds = els.allSettings.checked ? Object.keys(TABLES) : [els.setting.value];
      const results = settingIds.map((settingId, index) => simulate(settingId, games, (baseSeed + index * 0x9e3779b9) >>> 0));
      draw(results, games);
      renderSummary(results, games);
    }

    els.run.addEventListener("click", run);
    els.setting.addEventListener("change", () => {
      if (!els.allSettings.checked) run();
    });
    els.allSettings.addEventListener("change", run);
    run();
  </script>
</body>
</html>
